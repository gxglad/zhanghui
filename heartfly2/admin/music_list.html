var SEED={news:[{"id":"43","title":"又一个顶级爱豆要结婚了 ","content":"前两天，韩国男团东方神起成员沈昌珉在个人社交平台发布了自己的手写结婚宣告信信中的字迹工整，字体娟秀，虽是一张白纸，却格外的工整，能看出来沈昌珉的用心和诚意\n\n","time":"2020-06-16 20:45:51"},{"id":"42","title":"十大不完美身型，教你如何用穿搭来弥补？","content":"人人都有自己的穿衣困扰，别看明星们外表光鲜，难道她们真有所谓的完美身材吗？其实，大部分的好身材离不开会穿搭，会穿的女生即使不动刀，也能完美呈现在大家面前。今日，小编为大家列举以下十种身材缺陷，看她们是如何通过穿搭来弥补的。","time":"2020-06-16 20:45:33"},{"id":"41","title":"一篇攻略带你吃逛敦煌！","content":"敦煌这个名字在我脑海里已经萦绕了多年，\n\n大漠，狂沙，石窟，佛像，壁画，飞天，\n\n一直充斥于我的脑海，这是敦煌的魅力所在\n\n苍凉与悲壮则是敦煌的特点。\n驴肉黄面是敦煌的特色名吃，几乎每一家餐馆都有。黄面因色泽明亮金黄而得名，细如龙须，柔韧耐拉，口感劲道。敦煌的黄面好吃，主要在于香菇汁做得好。这香菇汁是用香菇末、驴肉丁、水豆腐等做成的哨子，带着汤汁，豆腐切成小块小块的，有点硬度，也有些嚼头。","time":"2020-06-16 20:45:14"},{"id":"40","title":"最新 | 珞璜新闻快看！","content":"全市最大的特大件及散货货场--珞璜铁路综合物流枢纽正抓紧建设。截止目前，整个货场工程正有序施工，散堆场、货物仓库等已经完成工程总量的80%，新增小型汽车装卸线等二期工程也已经全面展开施工。","time":"2020-06-16 20:44:10"},{"id":"19","title":"哈工大等被禁止使用MATLAB","content":"迫于美国政府的政策，Mathwork将禁止向哈尔滨工业大学、哈尔滨工程大学提供技术以及客户支持服务。” 6月10日，美国软件公司Mathwork客户支持部门的员工在一封给哈工大学生的回复邮件中表示。\n\n从6月6日起，哈工大、哈工程两校师生无法使用Mathwork公司的软件MATLAB。糟糕的是，未来两校将不能在公开发表的论文中出现任何使用MATLAB 得到的图表与数据 [1]。这是自今年5月底哈工大、哈工程被列入美国实体名单后，率先感受到的 “迎头痛击”。\n\n对此，国内有学者评论道，Mathwork 公司这一行为“违反合约”、“不讲信誉”。","time":"2020-06-16 20:33:35"},{"id":"18","title":"特斯拉Model S续航里程增长20%","content":"当地时间6月15日，特斯拉官网发布声明称，即日起，所有北美Model S长续航升级版本车辆均具有美国国家环境保护局（EPA）官方规定的402英里（约647公里）续航，与具有相同电池组设计的2019 Model S 100D相比，续驶里程增加了近20%。\n\n\n\n特斯拉CEO埃隆·马斯克（Elon Musk）随即发布推特表示，特斯拉Model S是首款接受美国国家环境保护局评测的续航里程超过400英里的电动汽车。\n\n特斯拉表示，北美Model S长续航升级版续航里程全面提升，是核心硬件和系统架构进行了多次迭代和转换而实现的。升级过后的Model S长续航升级版于今年初生产，新生产的该车型全部拥有402英里续航。\n\n特斯拉官网显示，Model S为四门Coupe轿车，于2012年推出，最初的入门续航里程为265英里。\n\n特斯拉Model S于5月27日曾在北美市场下调售价5000美元，在中国大陆市场，进口车型的Model S也同步下调基础售价，调整金额为下降29000元，同时超充实行按照使用计费的原则。\n\n目前，特斯拉北美官网显示，Model S最便宜的长续航升级版本目前定价分别为74990美元，在享受完5500美元的补贴后，最终购买价格为69490美元；特斯拉中国官网目前显示进口Model S、长续航版目前最终购买价格分别为76.49万元，进口Model S Performance高性能版价格分别为86.49万元。","time":"2020-06-16 20:34:38"},{"id":"17","title":"它们长相＂违规＂ 却各有生存之道","content":"一条橙色的短吻鳄在美国南卡罗来纳州哈纳罕的池塘附近被发现。同月晚些时候，在美国北卡罗莱纳州的卡拉巴什市又发现了第一条橙色短吻鳄。这两只短吻鳄并非来自相同的物种，南卡罗莱纳州自然资源部门认为，这些短吻鳄不同寻常的颜色更有可能是水锈所致，而不是进化的结果。不过，世界上可能已经有橙色的鳄鱼了。研究非洲加蓬阿班达洞穴系统的科学家们认为，非洲矮侏儒鱼种群的部分成员已经进化到可以在洞穴中生活的程度，它们以蝙蝠为食，并且正在变成橙色。\n","time":"2020-06-16 20:34:57"},{"id":"15","title":"腾讯计划入股爱奇艺成最大股东 已与百度接洽","content":"网易科技讯 6月16日消息，路透社报道称，据知情人士透露，腾讯计划成为爱奇艺的最大股东。一位知情人士表示，腾讯已经与拥有56.2%爱奇艺股权的百度就购买未确定规模的股份进行接洽，但腾讯目前是否已与爱奇艺接触仍是未知。此外，知情人士表示，该计划仍处于早期阶段，随时可能更改。\n\n知情人士表示:“合作将提高两家公司在制作和购买视频内容时的议价能力，并降低用于争夺彼此用户的营销成本。”","time":"2020-06-16 20:35:21"},{"id":"14","title":"不甘落后！外媒爆料苹果研发可折叠的iPhone","content":"6月15日，据外媒报道，苹果公司正在研发一款可折叠的iPhone/iPad设备。\n\n报道称，有消息人士在推特上表示，苹果正在进行一个独特的技术，可以将iPhone+iPad之类的设备合而为一。在被问及是否确定该技术能实际应用时，该博主给予了肯定的回答。\n\n\n\n据悉，自2017年以来，就有传言称苹果就一直在研究可折叠设备，将与LG合作开发一款可折叠iPhone。并且美国专利商标局公布了苹果的一份可折叠显示屏的专利申请。一年后，苹果公司获得了第二项具有柔性铰链的可折叠iPhone设计专利。\n\n此外，还有消息称三星已经向苹果和谷歌提供了可折叠屏幕的样品以供测试，不过目前还未曾见过相关的产品信息。\n\n瑞银（UBS）在2019年8月的一份报告中表示，苹果正在“稳步研发可折叠屏技术”，首先是iPad，然后是iPhone，这项技术至少要等到2021年才能进入成熟期。\n\n报告还指出，定价可能是将这样的产品推向市场的最大障碍之一。一项调查发现，虽然人们对可折叠苹果设备很感兴趣，但他们只愿意最多为其多花费600美元，如果这样算来这可比三星的Galaxy Fold发布时的价格要低。","time":"2020-06-16 20:46:30"},{"id":"13","title":"小鱼仙官儿","content":"夜神","time":"2019-01-08 10:06:25"},{"id":"12","title":"旭凤","content":"被杀","time":"2019-01-08 10:05:58"},{"id":"11","title":"旭凤","content":"火神","time":"2019-01-08 10:05:41"},{"id":"10","title":"锦觅","content":"繁花似锦觅安宁","time":"2019-01-08 10:05:23"},{"id":"9","title":"邓伦","content":"演员","time":"2019-01-08 10:04:42"}],music:[{"id":"47","title":"巧克力世界的童趣音乐旅程","content":"　《查理和巧克力工厂》改编自世界著名奇幻小说家罗尔德·达尔的同名儿童读物由好莱坞鬼才导演蒂姆·伯顿执导，配乐由与导演第十一度合作的音乐大师丹尼·耶夫曼操刀。为配合影片欢快惊险的剧情，两人让音乐也童趣十足。欢闹俏皮的旋律背后，是带有对社会善意的嘲讽和乐观的忧虑。这些音乐的整体大基调是流行化的，有着一气呵成的节奏与韵律，既有趣味性又有很强的融合性。","time":"2020-06-16 20:52:41"},{"id":"46","title":"电影传奇的音乐之旅","content":"　《金刚》，一部跨越70余年的电影传奇。从1933年到2005年，3部著名的《金刚》配乐沿着电影音乐艺术的发展轨迹一路走来。本期《音乐之声》将和您一起回顾它们各自的精彩。2005年影片《金刚》引用了美国上个世纪的经典爵士乐曲《我乐癫了》，在怀旧的歌声中，让我们来回味香港邵氏电影公司1977年出品的中国金刚电影——《猩猩王》，向1933年《金刚》的作曲家斯坦纳致敬。","time":"2020-06-16 20:52:34"},{"id":"45","title":" 三代女人 音乐断章","content":"　“茉”、“莉”、“花”三朵摇曳在时代浪潮中的女性，南腔北调两段动人民歌《茉莉花》——影片《茉莉花开》的配乐以民歌《茉莉花》为基调，谱写了上海沧桑中三代女性的爱情挽歌，一南一北两首《茉莉花》民歌旋律在片中的交替运用、三代女性都有一曲没有唱完的歌谣。担任本片配乐的著名作曲家苏聪和影片导演侯咏等人将在本期《音乐之声》中为大家解读一曲《茉莉花》。","time":"2020-06-16 20:52:25"},{"id":"44","title":"雾都悲伤温暖的旋律","content":"　影片《雾都孤儿》讲述了一个孤儿不堪虐待出走救济院，流亡街头又落入邪恶集团的悲惨故事，改编自英国著名现实主义小说家狄更斯的同名小说。与历届影片不同的是，导演罗曼·波兰斯基这次想通过他指导的《雾都孤儿》给孩子们一些现实的教育，这是符合原著精神气质的一个方面。作曲家用英格兰的调子、苏格兰的风格，同时把雾和云层的感觉让音乐再加上了一层重复，非常具有艺术色彩。","time":"2020-06-16 20:52:20"},{"id":"39","title":"孤海求生 震撼乐章","content":"灾难史诗片导演沃尔夫冈·彼得森倾力奉献，《完美风暴》原班人马再度出击，再现30年前荧幕上的海难历险。《海神号》，灾难片音乐的新典范。好莱坞的新生代作曲家克劳斯·巴代特再谱乐章，电子合成器的音效配合传统交响乐队的演奏，激荡出具有压迫感的震撼配乐。本期《音乐之声》将带您感受音画完美结合的海上惊险旅程。","time":"2020-06-16 20:40:08"},{"id":"38","title":" 爱的花朵 爱的挽歌","content":"　影片的音乐始终饱含着情感，紧扣剧情和人物情感谱写出传达影片内涵的旋律，而且全片的音乐以纯音乐为主，大量采用了钢琴独奏、小提琴独奏以及弦乐合奏的古典音乐形式，让观众感受到了对这段凄美爱情的感伤，对宿命安排的无奈，更有对得到真爱那一刹那的感动。回味《雏菊》感人故事，再品《雏菊》古典乐章，敬请关注每周四下午15：30分电影频道播出的《音乐之声》。","time":"2020-06-16 20:39:59"},{"id":"37","title":"人与自然的冥想曲","content":"20年来，出于对故事中人物以及雪撬犬之间深厚情谊的赞叹，出于对南极——这片大自然的圣地的憧憬，出于对南极科考人员的敬意，一个故事两度被搬上荧幕，两部影片的风格以及配乐特点迥然不同，构成了一幅电影人对南极声光影像的寻踪记。重温1983年《南极物语》精彩段落，再忆电子合成乐大师范吉利斯激情配乐，共品新版《南极大冒险》传奇故事，尽在本周《音乐之声》。","time":"2020-06-16 20:39:51"},{"id":"36","title":" 疯狂音乐哄堂彩","content":"　一段极其复杂的偷盗故事，带来一种横空出世的黑色幽默。一部放下艺术身段的小制作电影，在中国影坛以复杂的情节、实用的结构拔得头筹。精巧的剧本，恰当的演员选择，优秀的场面调度，多元化的配乐表现，风格化的后期剪辑，以及少有破绽的表演，这些缺一不可的元素成就了《疯狂的石头》的疯狂票房。本期《音乐之声》带您走进《疯狂的石头》的新现实主义配乐，在疯狂的音乐理念中终极疯狂。","time":"2020-06-16 20:39:46"},{"id":"35","title":"乱世浮华悲凉梦","content":"这个故事发生在上个世纪三十年代的上海，讲述的是恢宏的时代背景下，两个弱小人物的命运。男女主人公在异国的土地上，顽强地与命运抗争着，艰难地追求着梦幻般的理想。影片的音乐不仅把我们带回到那个时代的氛围，而且时刻透露着婉约典雅的风范，与主人公的身份气质相配合。十分贴切的烘托着影片的情绪，渲染着故事的情节，蕴涵着人物的情感。","time":"2020-06-16 20:39:40"},{"id":"34","title":" 超人音乐 精彩回归","content":"《超人》系列的电影从1978年拍的第一部就影响了全世界。为第一部《超人》配乐的大师就是美国著名的电影音乐大师约翰·威廉姆斯，这是在电影配乐史上非常重要的一部作品。2006年我们迎来了一部大片《超人归来》。《超人》音乐也重新回到我们身边。为这部电影音乐操刀的是作曲约翰·奥特曼。在这部《超人》系列的电影配乐中，我们可以发现“经典回归再取样”是作曲家主要的一种风格……","time":"2020-06-16 20:39:34"},{"id":"33","title":"狂飙猛进三部曲","content":"　《碟中谍》系列电影的主题音乐是由阿根廷作曲家拉罗·希福林所创作的,这首大家耳熟能详的经典音乐叫做“导火线主题”。10年来，三部惊险刺激的电影中沿用这个主题音乐，通过不同的音乐手法，把影片传播到世界的很多角落。如今我们已经很难分清是电影流行了这首主题曲，还是这首主题曲让人们记住了电影。","time":"2020-06-16 20:39:29"},{"id":"32","title":"功夫音乐新看点","content":"《龙虎门》改编自香港著名漫画家黄玉郎的经典漫画，影片以王小虎、王小龙和石黑龙三个热血青年所创立的龙虎门武馆为主线，弘扬了警恶惩奸，除强扶弱的精神。川井宪次的音乐世界和《龙虎门》的漫画风格十分吻合。他的音乐张扬不羁、装饰性很强，整篇音乐摇滚、电子、古典交响同时出现在一个电影里，十分适合漫画天马行空的感觉。","time":"2020-06-16 20:39:23"},{"id":"31","title":"皮克斯音乐总动员","content":"迪斯尼动画片在早期的配乐中，通常会选择很多著名的古典音乐作为动画片的主要配乐。20世纪皮克斯公司的加盟，使得这种古典派的配乐手法有所更新，在皮克斯的动画片中我们更多的是能感受到一些当今社会受人喜欢的一些东西，更多的是爵士乐、流行乐、摇滚乐。这些流行音乐的主要风格也成为皮克斯动画电影配乐的主流风格……","time":"2020-06-16 20:39:16"},{"id":"30","title":"最后决战狂想曲","content":"　超级英雄重装上阵，X战警再度归来，从作曲家迈克尔凯曼到的黑色旋律到约翰奥特曼的英雄主题，配乐大师鲍威尔再度接手电影《X战警３》的音乐创作，这部电影配乐被公认为是三部系列电影中最宏大最有英雄史诗气质的。本期《音乐之声》让我们走进本片的音乐世界，在音乐嘉宾的引领下品味作曲家鲍威尔的音乐风格，看他如何超越前辈，成功打造X战警最后决战的电影音乐。","time":"2020-06-16 20:39:09"},{"id":"29","title":"寂寞的音乐盛宴","content":"　欲望，爱情，背判，仇恨，一部情感错综复杂的宫廷式悲剧，一个华丽而凄美的故事，一曲寂寞且哀怨的悲歌。古典与现代的音乐结合，东方与西方的思想融汇，一次将各种元素并融的电影音乐盛宴。这是一场皇宫内权力和欲望的争夺，是一段爱与恨、惨烈与痴狂的对歌。《音乐之声》带您细细品味《夜宴》配乐的个中滋味。","time":"2020-06-16 20:39:03"},{"id":"28","title":"旋律史诗再现圆明园","content":"　圆明园，在历史的光阴中隐现，在雄雄的烈火中挣扎。当我们已经无法在那些满目创痍、断壁残垣的景象中，联想起它曾经拥有的恢弘壮阔的时候，北京科学教育制片厂倾情制作了大型史诗电影《圆明园》，以精美绝伦的创作手法，真实客观的再现了这座万园之园。作曲家戚小源做客《音乐之声》讲述用音乐构建的这座人间仙境，用音乐鸣唱的那段历史。","time":"2020-06-16 20:38:56"},{"id":"27","title":"万里行歌","content":"　云与水的相遇，是一段缠绵，却阻隔千山万水。青春的爱情，惊鸿一瞥或者回眸一笑却填不满长长的海峡。电影《云水谣》跨越了60多年，从宝岛台湾到朝鲜战场再到西藏，通过一个男人和两个女人的爱情主题，来描绘一种民族的情感。作曲家邹野为影片谱写配乐，打造出一段一生、三地的爱情绝唱。","time":"2020-06-16 20:38:48"},{"id":"26","title":"梁静茹","content":"勇气","time":"2019-01-08 10:11:19"},{"id":"24","title":"王俊凯","content":"有种味道就叫做家.","time":"2020-06-16 18:34:33"},{"id":"23","title":"放羊的星星","content":"我们的纪念3","time":"2020-06-16 18:39:36"},{"id":"22","title":"林志颖","content":"赛车手","time":"2019-01-08 10:09:50"},{"id":"21","title":"毛不易","content":"不染","time":"2019-01-08 10:09:28"},{"id":"20","title":"萨顶顶","content":"左手指月","time":"2019-01-08 10:09:15"},{"id":"8","title":"张杰","content":"最佳男歌手诶","time":"2019-01-08 09:17:15"}]};
function db(){var s=localStorage.getItem(KEY);if(!s){localStorage.setItem(KEY,JSON.stringify(SEED));s=JSON.stringify(SEED);}return JSON.parse(s);}
function save(d){localStorage.setItem(KEY,JSON.stringify(d));}
function needLogin(){if(sessionStorage.getItem('heartfly_admin')!=='1'){location.href='login.html';}}
function logout(){sessionStorage.removeItem('heartfly_admin');location.href='login.html';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>

(function(){var d=db(),tb=document.getElementById('tb');
document.getElementById('cnt').textContent=d['music'].length;

tr.innerHTML='<td>'+esc(r.id)+'</td><td>'+esc(r.title)+'</td><td>'+(r.time||'').slice(0,10)+'</td>'+
'<td><button class="btn btn-sm btn-outline-secondary" onclick="editRow('+i+')">编辑</button> '+
'<button class="btn btn-sm btn-outline-danger" onclick="delRow('+i+')">删除</button></td>';
tb.appendChild(tr);});})();
function delRow(i){ if(!confirm('确定删除这条音乐吗？'))return; var d=db(); d['music'].splice(i,1); save(d); location.reload(); }
function editRow(i){ var d=db(),r=d['music'][i]; var t=prompt('修改标题：',r.title); if(t===null)return; var c=prompt('修改内容：',r.content); if(c===null)return; r.title=t; r.content=c; r.time=new Date().toISOString().slice(0,19).replace('T',' '); save(d); location.reload(); }
</script>
